[workspace]
resolver = "2"
members = [
    "crates/aegoris-core",
    "crates/aegoris-llm",
    "crates/aegoris-render",
    "crates/aegoris-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
aegoris-core = { path = "crates/aegoris-core" }
aegoris-llm = { path = "crates/aegoris-llm" }
aegoris-render = { path = "crates/aegoris-render" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
pdf-extract = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
